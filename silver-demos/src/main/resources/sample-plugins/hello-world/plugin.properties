# Hello World Plugin Descriptor
# This file describes the plugin metadata for Foundation's plugin system

# Plugin metadata
name=Hello World Plugin
version=1.0.0
vendor=Foundation Framework
description=A simple demonstration plugin that displays a greeting window

# Launch configuration
jar=hello-world-plugin.jar
mainClass=org.jwellman.foundation.plugins.HelloWorldPlugin
launchMode=ISOLATED_JVM

# No additional classpath needed for this simple plugin
# classpath=

# JVM arguments (optional)
# jvmArgs=-Xmx256m

# Application arguments (optional)
# appArgs=

# UI Integration
# icon=icon.png
windowTitle=Hello World Plugin

# Feature flags
allowMultipleInstances=true
